<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Advanced Web Page</title>

  <!-- 🌈 Advanced CSS Styling -->
  <style>
    /* Smooth scrolling and global transitions */
    * {
      scroll-behavior: smooth;
      transition: all 0.3s ease-in-out;
    }

    /* Beautiful gradient background with animation */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(120deg, #89f7fe, #66a6ff, #8e2de2, #4a00e0);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism container */
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px 60px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      color: white;
      width: 90%;
      max-width: 600px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Header with glowing text */
    h1 {
      font-size: 40px;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 10px #66a6ff, 0 0 20px #66a6ff;
      animation: fadeInDown 1.2s ease;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Subheader */
    h2 {
      font-size: 24px;
      color: #a7ff83;
      margin-top: 20px;
      text-shadow: 0 0 10px rgba(0, 255, 150, 0.6);
    }

    /* Paragraphs */
    p {
      font-size: 18px;
      color: #f5f5f5;
      line-height: 1.7;
      margin: 10px 0;
    }

    /* Divider with glow */
    hr {
      height: 2px;
      border: none;
      background: linear-gradient(90deg, #89f7fe, #66a6ff, #8e2de2);
      margin: 25px auto;
      width: 80%;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
    }

    /* Button with neon hover glow */
    .btn {
      background: linear-gradient(90deg, #4a00e0, #8e2de2);
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 10px rgba(142, 45, 226, 0.6);
      transition: all 0.3s ease;
    }

    .btn:hover {
      box-shadow: 0 0 25px rgba(142, 45, 226, 1), 0 0 40px rgba(102, 166, 255, 1);
      transform: scale(1.08);
    }

    /* Responsive design */
    @media (max-width: 600px) {
      .container {
        padding: 30px;
      }
      h1 {
        font-size: 30px;
      }
      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello, World! 🌍</h1>
    <p>Welcome to my <strong>advanced</strong> HTML and CSS web page ✨</p>
    <hr>
    <h2>About Me</h2>
    <p>I’m exploring animations, gradients, glassmorphism, and responsive design with CSS!</p>
    <button class="btn">Learn More 🚀</button>
  </div>
</body>
</html>
