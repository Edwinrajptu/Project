<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>

    <!-- 🌈 CSS Styling Section -->
    <style>
        body {
            background-color: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            margin: 40px;
        }

        h1 {
            color: #0066cc;
            text-align: center;
        }

        h2 {
            color: #009933;
            margin-top: 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        hr {
            border: 0;
            height: 2px;
            background: #ccc;
            margin: 20px 0;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px 40px;
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hello, World!</h1>
        <p>Welcome to my first HTML and CSS web page.</p>
        <hr>
        <h2>About Me</h2>
        <p>I’m learning HTML, CSS, and GitHub through VS Code!</p>
    </div>
</body>
</html>
