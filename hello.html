<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>

    <!-- 🌈 Enhanced CSS Styling Section -->
    <style>
        /* Background and general styles */
        body {
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            font-family: 'Poppins', Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Centered content box */
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.15);
            padding: 30px 50px;
            max-width: 600px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* Header animation */
        h1 {
            color: #0055aa;
            font-size: 36px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #009933;
            margin-top: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        hr {
            border: 0;
            height: 2px;
            background: linear-gradient(to right, #66a6ff, #89f7fe);
            margin: 25px 0;
        }

        /* Stylish button */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hello, World!</h1>
        <p>Welcome to my enhanced HTML and CSS web page 🎨</p>
        <hr>
        <h2>About Me</h2>
        <p>I’m learning HTML, CSS, and GitHub through VS Code!</p>
        <button class="btn">Learn More</button>
    </div>
</body>
</html>
